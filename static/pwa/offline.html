
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5ed7">
  <title>ACZ - You're Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f8ff;
      color: #12315c;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      max-width: 380px;
      padding: 28px;
    }
    .logo {
      width: 76px;
      height: 76px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #0b5ed7;
      color: white;
      font-size: 30px;
      font-weight: 800;
    }
    button {
      margin-top: 18px;
      padding: 13px 24px;
      border: 0;
      border-radius: 12px;
      background: #0b5ed7;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">A</div>
    <h1>You're Offline</h1>
    <p>ACZ needs an internet connection to load your account and services.</p>
    <p>Your account, payment and application information has not been changed.</p>
    <button onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
