<!DOCTYPE html>
<html>
<head>
<title>Aditya Cyber Zone</title>

<style>

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
background:white;
padding:40px;
border-radius:15px;
width:300px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.2);
}

h1{
margin-bottom:30px;
}

a{
text-decoration:none;
}

button{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
transform:scale(1.03);
}

</style>
</head>

<body>

<div class="box">

<h1>Aditya Cyber Zone</h1>

{% for link in links %}

<a href="{{ link.url }}">

<button>

{{ link.icon }} {{ link.name }}

</button>

</a>

{% endfor %}

</div>

</body>
</html>
