<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>
    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
            padding:40px;
        }
        .box{
            width:500px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 0 10px #ccc;
        }
        h2{
            color:green;
        }
        .btn{
            display:inline-block;
            margin-top:20px;
            background:#007bff;
            color:white;
            padding:12px 18px;
            text-decoration:none;
            border-radius:8px;
        }
    </style>
</head>
<body>

<div class="box">

<h2>✅ Payment Successful</h2>

<p><b>Reference No:</b> {{ application.payment_reference_no }}</p>

<p><b>Receipt No:</b> {{ application.receipt_no }}</p>

<p><b>Amount Paid:</b> ₹{{ application.paid_amount }}</p>

<a class="btn" href="/receipt/{{ application.id }}/">
Download Receipt
</a>

<br><br>

<a href="/customer-dashboard/">
Back to Dashboard
</a>

</div>

</body>
</html>
