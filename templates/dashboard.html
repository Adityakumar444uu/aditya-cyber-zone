{% load static %}
<!DOCTYPE html><html lang="en">
<head>


<link rel="stylesheet" href="{% static 'css/admin.css' %}">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aditya Cyber Zone - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f6f9;
    }
    .sidebar {
      height: 100vh;
      background: #111827;
      color: white;
      position: fixed;
      width: 240px;
      padding: 20px;
    }
    .sidebar h3 {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .sidebar a {
      display: block;
      color: #cbd5e1;
      padding: 10px;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .sidebar a:hover {
      background: #1f2937;
      color: white;
    }
    .main {
      margin-left: 260px;
      padding: 20px;
    }
    .card-box {
      border-radius: 12px;
      padding: 20px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .table-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body><div class="sidebar">
  <h3>Aditya Cyber Zone</h3>
  <a href="#">Dashboard</a>
  <a href="#">Add Customer</a>
  <a href="#">View Customers</a>
  <a href="#">Search</a>
  <a href="#">Logout</a>
</div><div class="main">
  <h2>Dashboard</h2>  <div class="row mt-3">
    <div class="col-md-4">
      <div class="card-box">
        <h5>Total Customers</h5>
        <h3>120</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-box">
        <h5>Today Entries</h5>
        <h3>8</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card-box">
        <h5>Pending Delivery</h5>
        <h3>5</h3>
      </div>
    </div>
  </div>  <div class="table-container mt-4">
    <h5>Recent Customers</h5>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Aadhar</th>
          <th>App No</th>
          <th>Contact</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Sample Name</td>
          <td>123456789012</td>
          <td>APP001</td>
          <td>9876543210</td>
          <td>2026-05-10</td>
        </tr>
      </tbody>
    </table>
  </div>
</div></body>
</html>
