<!DOCTYPE html>
<html>
<head>
    <title>Customer Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:black;
            overflow:hidden;
        }

        .bg{
            position:absolute;
            width:100%;
            height:100%;
            background:linear-gradient(135deg,#000428,#004e92);
            animation:bgmove 8s infinite alternate;
        }

        .login-box{
            position:relative;
            width:380px;
            padding:35px;
            border-radius:18px;
            background:rgba(0,0,0,0.75);
            border:1px solid #00e5ff;
            box-shadow:0 0 25px #00e5ff;
            color:white;
            z-index:2;
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#00e5ff;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            background:#101820;
            color:white;
            border:1px solid #00e5ff;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#00e5ff;
            color:black;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            box-shadow:0 0 15px #00e5ff;
        }

        .register-link{
            text-align:center;
            margin-top:18px;
        }

        a{
            color:#00e5ff;
            text-decoration:none;
        }

    </style>
</head>

<body>

<div class="bg"></div>

<div class="login-box">

<h2>DIGITAL ACCESS</h2>

<form method="POST">

{% csrf_token %}

<input type="text"
name="username"
placeholder="ENTER USERNAME"
required>


<input type="password"
name="password"
placeholder="ENTER SECURITY PIN"
required>


<label style="display:block; margin-top:10px; color:white;">

<input type="checkbox"
onclick="togglePassword()">

Show Password

</label>


<button type="submit">

ACCESS SYSTEM

</button>

</form>


<div class="register-link">

<a href="/customer-register/">

Create New Customer Account

</a>

</div>

</div>


<script>

function togglePassword(){

var pass =
document.querySelector('input[name="password"]');

if(pass.type=="password"){

pass.type="text";

}

else{

pass.type="password";

}

}


{% if error %}
alert("❌ Invalid Username or Password");
{% endif %}


{% if request.GET.success %}
alert("✅ Registration Successful");
{% endif %}


</script>

</body>
</html>
