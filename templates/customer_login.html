<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ACZ Premium Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at top,#4b00ff,#09131f 45%,#02070d);
overflow:hidden}
body:before,body:after{content:'';position:fixed;border-radius:50%;filter:blur(70px);opacity:.7}
body:before{width:260px;height:260px;background:#00e5ff;top:-60px;left:-40px;animation:f 8s infinite alternate}
body:after{width:300px;height:300px;background:#ff00d4;bottom:-80px;right:-60px;animation:f 10s infinite alternate-reverse}
@keyframes f{to{transform:translate(40px,-20px) scale(1.2)}}}
#preloader{position:fixed;inset:0;background:#06101d;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#7ef9ff;z-index:9999}
.loader{width:70px;height:70px;border:6px solid #1d3557;border-top-color:#7ef9ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{width:380px;background:rgba(255,255,255,.10);backdrop-filter:blur(18px);padding:30px;border-radius:22px;border:1px solid rgba(255,255,255,.2);box-shadow:0 0 20px #00e5ff,0 0 45px #7a00ff;color:#fff}
h2{text-align:center;margin-bottom:20px}
.input{position:relative;margin:16px 0}
.input input{width:100%;padding:12px 42px 12px 12px;border:none;border-radius:8px;background:#18293d;color:#fff}
.input i{position:absolute;right:14px;top:14px;cursor:pointer}
button{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(90deg,#00e5ff,#7a00ff,#ff00d4);color:#fff;font-weight:bold;cursor:pointer;transition:.3s}
a{color:#7ef9ff;text-decoration:none}
button:hover{transform:scale(1.03);box-shadow:0 0 25px #00e5ff}
h2{color:#7ef9ff;text-shadow:0 0 10px #00e5ff,0 0 20px #7a00ff}
</style>
</head>
<body>
<div id="preloader">
<div class="loader"></div>
<p style="margin-top:20px">Initializing ACZ Secure Login...</p>
</div>

<div class="card">
<h2><i class="fa-solid fa-shield-halved"></i> ACZ Login</h2>
<form method="POST">
{% csrf_token %}
<div class="input">
<input type="text" name="aadhaar_no" placeholder="Aadhaar Number" required>
</div>
<div class="input">
<input id="pwd" type="password" name="password" placeholder="Password" required>
<i class="fa-solid fa-eye" onclick="togglePwd(this)"></i>
</div>
<button type="submit">Secure Login</button>
<div style="margin-top:15px;text-align:center">
<a href="/customer-forgot-password/">Forgot Password?</a><br><br>
<a href="/customer-register/">Create Account</a>
</div>
</form>
{% if error %}
<script>
window.addEventListener("load",()=>Swal.fire({icon:"error",title:"Login Failed",text:"{{ error }}"}));
</script>
{% endif %}
</div>

<script>
setTimeout(()=>document.getElementById("preloader").style.display="none",1800);
function togglePwd(el){
 const p=document.getElementById("pwd");
 if(p.type==="password"){p.type="text";el.className="fa-solid fa-eye-slash";}
 else{p.type="password";el.className="fa-solid fa-eye";}
}
</script>
</body>
</html>
