<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body{
            font-family:Arial;
            min-height:100vh;
            margin:0;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#08111f,#0d6efd,#20c997);
        }
        .box{
            width:380px;
            background:white;
            padding:30px;
            border-radius:18px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }
        h2{
            text-align:center;
            color:#0d6efd;
        }
        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:10px;
            box-sizing:border-box;
        }
        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#0d6efd;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
        .msg{
            background:#fff3cd;
            padding:10px;
            border-radius:8px;
            margin-bottom:10px;
            color:#856404;
        }
        a{
            display:block;
            text-align:center;
            margin-top:15px;
            color:#0d6efd;
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Forgot Password</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="msg">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="aadhaar_no" placeholder="Enter Aadhaar Number" required>
        <input type="text" name="contact_no" placeholder="Enter Mobile Number" required>

        <input type="password" name="new_password" placeholder="New Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Reset Password</button>
    </form>

    <a href="/customer-login/">Back to Login</a>
</div>

</body>
</html>
