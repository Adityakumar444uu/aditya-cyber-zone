<!DOCTYPE html>
<html>
<head>
    <title>Customer Register</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#000428,#004e92);
        }

        .register-box{
            width:420px;
            padding:35px;
            border-radius:18px;
            background:rgba(0,0,0,0.78);
            border:1px solid #00e5ff;
            box-shadow:0 0 25px #00e5ff;
            color:white;
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#00e5ff;
            letter-spacing:2px;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            outline:none;
            border-radius:8px;
            background:#101820;
            color:white;
            border:1px solid #00e5ff;
        }

        input:focus{
            box-shadow:0 0 12px #00e5ff;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#00e5ff;
            color:black;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            box-shadow:0 0 15px #00e5ff;
        }

        .secure{
            text-align:center;
            margin-top:15px;
            color:#00ff88;
            font-size:14px;
        }

        .login-link{
            text-align:center;
            margin-top:18px;
        }

        a{
            color:#00e5ff;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h2>SECURE REGISTRATION</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="name" placeholder="ENTER FULL NAME" required>

        <input type="text" name="aadhaar_no" placeholder="ENTER AADHAAR NUMBER" required>

        <input type="text" name="contact_no" placeholder="ENTER CONTACT NUMBER" required>

        <input type="text" name="username" placeholder="CREATE USERNAME" required>

        <input type="password" name="password" placeholder="CREATE SECURITY PIN" required>
<label style="display:block; margin-top:10px; color:white;">
<input type="checkbox" onclick="togglePassword()">
Show Password
</label>

        <button type="submit">REGISTER & ACCESS</button>
    </form>

    <div class="secure">
        ENCRYPTED CUSTOMER ACCESS SYSTEM
    </div>

    <div class="login-link">
        <a href="/customer-login/">Already Have Account? Login</a>
    </div>

</div>
<script>

function togglePassword(){

var pass =
document.querySelector('input[name="password"]');

if(pass.type=="password"){
pass.type="text";
}
else{
pass.type="password";
}

}

{% if success %}
alert("✅ Registration Successful");
{% endif %}

{% if error %}
alert("❌ {{ error }}");
{% endif %}

</script>
</body>
</html>
