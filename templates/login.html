<!DOCTYPE html>
<html>
<head>
    <title>Login | Aditya Cyber Zone</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#141e30,#243b55);
            overflow:hidden;
        }

        body::before{
            content:"";
            position:absolute;
            width:400px;
            height:400px;
            background:#00d4ff;
            border-radius:50%;
            top:-120px;
            left:-120px;
            filter:blur(30px);
            opacity:0.5;
        }

        body::after{
            content:"";
            position:absolute;
            width:350px;
            height:350px;
            background:#ff00cc;
            border-radius:50%;
            bottom:-100px;
            right:-100px;
            filter:blur(30px);
            opacity:0.45;
        }

        #preloader{
            position:fixed;
            inset:0;
            background:#141e30;
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:9999;
        }

        .loader{
            width:60px;
            height:60px;
            border:6px solid rgba(255,255,255,0.4);
            border-top:6px solid #00d4ff;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            100%{ transform:rotate(360deg); }
        }

        .login-box{
            position:relative;
            z-index:2;
            width:360px;
            padding:38px;
            border-radius:24px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            box-shadow:0 20px 50px rgba(0,0,0,0.35);
            border:1px solid rgba(255,255,255,0.25);
            text-align:center;
            color:white;
        }

        .login-box h2{
            margin-bottom:6px;
            font-size:28px;
        }

        .login-box p{
            margin-bottom:28px;
            color:rgba(255,255,255,0.8);
        }

        input{
            width:100%;
            padding:14px;
            margin:10px 0;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.18);
            color:white;
            font-size:15px;
            box-sizing:border-box;
            border:1px solid rgba(255,255,255,0.25);
        }

        input::placeholder{
            color:rgba(255,255,255,0.75);
        }

        button{
            width:100%;
            padding:14px;
            margin-top:16px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#00d4ff,#007bff);
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(0,212,255,0.4);
        }

        .error{
            color:#ffdddd;
            background:rgba(255,0,0,0.25);
            padding:8px;
            border-radius:8px;
            margin-bottom:12px;
        }
    </style>
</head>

<body>

<div id="preloader">
    <div class="loader"></div>
</div>

<div class="login-box">
    <h2>Aditya Cyber Zone</h2>
    <p>Staff Login Panel</p>

    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Enter Username" required>
        <input type="password" name="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>
</div>

<script>
window.addEventListener("load", function(){
    setTimeout(function(){
        document.getElementById("preloader").style.display = "none";
    }, 700);
});
</script>

</body>
</html>
